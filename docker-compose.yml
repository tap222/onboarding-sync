# Optional, and NOT the recommended setup: the default uses only the database
# (outbox-as-queue + DB idempotency keys). Only if Kafka or Redis is ever justified:
#   docker compose up -d
#   REDIS_URL=redis://localhost:6379/0 BUS=kafka KAFKA_BOOTSTRAP=localhost:9092 uvicorn hiresync.api:api
services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
  # Local trace viewer for development: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, UI on :16686.
  # Production points the same variable at the existing observability backend instead.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
